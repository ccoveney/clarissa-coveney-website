<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CV | Clarissa R. Coveney</title>

  <!-- If your favicon is named favicon.png, leave this line unchanged -->
  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    :root {
      --navy: #24364b;
      --burgundy: #7d233d;
      --gray: #777777;
      --light-gray: #e5e5e5;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--navy);
      background: var(--white);
      line-height: 1.6;
    }

    nav {
      background: var(--white);
      border-bottom: 1px solid var(--light-gray);
      padding: 18px 20px;
      text-align: center;
    }

    nav a {
      color: var(--navy);
      text-decoration: none;
      margin: 0 12px;
      font-size: 0.9rem;
      font-weight: normal;
    }

    nav a:hover {
      color: var(--burgundy);
    }

    header {
      padding: 70px 20px 35px;
      text-align: center;
    }

    h1 {
      margin: 0;
      color: var(--navy);
      font-size: 2.7rem;
      font-weight: normal;
      letter-spacing: 0.02em;
    }

    header p {
      color: var(--gray);
      margin-top: 10px;
      font-size: 1rem;
    }

    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 20px 90px;
    }

    .cv-box {
      padding: 45px 20px 55px;
      text-align: center;
    }

    .cv-download {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--navy);
      border: 1.5px solid var(--navy);
      padding: 14px 22px;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: bold;
      letter-spacing: 0.08em;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .cv-download:hover {
      background: var(--navy);
      color: var(--white);
    }

    .download-icon {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .updated {
      color: var(--gray);
      font-size: 0.85rem;
      margin-top: 18px;
    }

    footer {
      border-top: 1px solid var(--light-gray);
      color: var(--gray);
      padding: 25px 20px;
      text-align: center;
      font-size: 0.85rem;
    }

    @media (max-width: 700px) {
      nav a {
        display: inline-block;
        margin: 5px 7px;
      }

      header {
        padding-top: 50px;
      }

      h1 {
        font-size: 2.2rem;
      }

      .cv-box {
        padding-top: 30px;
      }
    }
  </style>
</head>

<body>

  <nav>
    <a href="index.html">Home</a>
    <a href="index.html#about">About</a>
    <a href="index.html#research">Research</a>
    <a href="publications.html">Publications</a>
    <a href="cv.html">CV</a>
    <a href="index.html#contact">Contact</a>
  </nav>

  <header>
    <h1>CV</h1>
    <p>Clarissa R. Coveney, DPhil</p>
  </header>

  <main>
    <div class="cv-box">

      <a
        class="cv-download"
        href="Clarissa-Coveney-CV.pdf"
        download
        aria-label="Download Clarissa Coveney's CV"
      >
        <svg
          class="download-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M12 3v11"></path>
          <path d="m7 10 5 5 5-5"></path>
          <path d="M5 20h14"></path>
        </svg>

        <span>DOWNLOAD CV</span>
      </a>

      <p class="updated">
        This CV is current as of September 14th, 2026.
      </p>

    </div>
  </main>

  <footer>
    <p>© 2026 Clarissa R. Coveney</p>
  </footer>

</body>
</html>
